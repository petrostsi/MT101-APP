name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build SwiftBatchProcessor.sln -c Release
      - name: Test
        run: dotnet test tests/SwiftBatchProcessor.Tests/SwiftBatchProcessor.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
